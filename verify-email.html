<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification - EasyInvite</title>
  <link rel="stylesheet" href="css/common.css?v=2.7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .verify-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      max-width: 480px;
      width: 90%;
      padding: 40px 32px;
      text-align: center;
    }
    .verify-icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .verify-icon-wrap.loading {
      background: #eff6ff;
      color: #2563eb;
    }
    .verify-icon-wrap.success {
      background: #ecfdf5;
      color: #059669;
    }
    .verify-icon-wrap.error {
      background: #fef2f2;
      color: #dc2626;
    }
    .verify-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 10px;
    }
    .verify-desc {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.55;
      margin: 0 0 28px;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s ease;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="verify-card">
    <div class="verify-icon-wrap loading" id="icon-wrap">
      <div class="spinner" id="spinner"></div>
    </div>
    <h1 class="verify-title" id="verify-title">Verifying Your Email...</h1>
    <p class="verify-desc" id="verify-desc">Please wait while we confirm your email address and activate your EasyInvite account.</p>
    <div id="action-area" style="display: none;">
      <a href="index.html" class="btn-action" id="btn-redirect">Go to Dashboard</a>
    </div>
  </div>

  <script>
    (async function verifyEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const iconWrap = document.getElementById('icon-wrap');
      const title = document.getElementById('verify-title');
      const desc = document.getElementById('verify-desc');
      const actionArea = document.getElementById('action-area');
      const btnRedirect = document.getElementById('btn-redirect');

      if (!token) {
        iconWrap.className = 'verify-icon-wrap error';
        iconWrap.innerHTML = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
        title.textContent = 'Missing Verification Token';
        desc.textContent = 'No verification token was provided in the URL. Please click the full link in your verification email.';
        actionArea.style.display = 'block';
        btnRedirect.textContent = 'Back to Login';
        return;
      }

      try {
        const res = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();

        if (data.success) {
          iconWrap.className = 'verify-icon-wrap success';
          iconWrap.innerHTML = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>';
          title.textContent = 'Email Verified Successfully!';
          desc.textContent = 'Your EasyInvite account has been verified and activated. You can now compose, preview, and send Google Play closed testing invitations.';
          const plan = (data.user && data.user.plan_id) || data.chosenPlan || 'free';
          if (plan && plan !== 'free') {
            btnRedirect.href = `billing.html?openPayment=${encodeURIComponent(plan)}`;
            btnRedirect.textContent = 'Proceed to Payment Verification';
          } else {
            btnRedirect.href = 'index.html';
            btnRedirect.textContent = 'Open EasyInvite Dashboard';
          }

          if (data.token) {
            localStorage.setItem('easyinvite_auth_token', data.token);
            if (data.user) {
              localStorage.setItem('easyinvite_user', JSON.stringify(data.user));
            }
          }
        } else {
          iconWrap.className = 'verify-icon-wrap error';
          iconWrap.innerHTML = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
          title.textContent = 'Verification Failed';
          desc.textContent = data.error || 'This verification link is invalid or has expired.';
          actionArea.style.display = 'block';
          btnRedirect.textContent = 'Back to EasyInvite';
        }
      } catch (err) {
        iconWrap.className = 'verify-icon-wrap error';
        iconWrap.innerHTML = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        title.textContent = 'Connection Error';
        desc.textContent = 'Could not reach server to verify email. Please check your internet connection.';
        actionArea.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
