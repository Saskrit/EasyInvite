services:
  - type: web
    name: easyinvite
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: APP_NAME
        sync: false
      - key: APP_PACKAGE_ID
        sync: false
      - key: CLOSED_TESTING_URL
        sync: false
      - key: PLAY_STORE_URL
        sync: false
